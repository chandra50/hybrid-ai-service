[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-ai"
version = "0.1.0"
description = "Hybrid edge/field/hub/cloud MCP agents for industrial field service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["python-pptx>=1.0"]

[project.scripts]
hybrid-ai-sim = "hybrid_ai.sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hybrid_ai.contracts" = ["tools.json"]
