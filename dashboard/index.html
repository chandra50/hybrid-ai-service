<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hybrid-ai Field Ops</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">hybrid-ai Field Ops</div>
        <div class="brand-sub">California fleet · demo data · <span id="sim-clock"></span></div>
      </div>
    </div>
    <div class="persona" role="tablist" aria-label="Persona">
      <button role="tab" class="persona-btn active" data-persona="supervisor">Supervisor</button>
      <button role="tab" class="persona-btn" data-persona="technician">Technician</button>
      <button role="tab" class="persona-btn" data-persona="walkthrough">Assigned tech walkthrough</button>
    </div>
  </header>

  <section class="modebar" aria-label="Network mode">
    <div class="modebar-group">
      <span class="modebar-label">Network mode</span>
      <div id="mode-chips" class="mode-chips" role="radiogroup" aria-label="Network mode"></div>
      <span class="modebar-label">Events</span>
      <label class="ev-toggle"><input type="checkbox" id="ev-ai"> Cloud AI outage</label>
      <label class="ev-toggle"><input type="checkbox" id="ev-sensors"> Sensors lost</label>
    </div>
    <div class="modebar-group scenario">
      <span class="modebar-label">Scenario</span>
      <select id="scenario-select" aria-label="Scenario"></select>
      <button id="scenario-play" class="btn small">Play</button>
      <div id="scenario-bar" class="scenario-bar" aria-hidden="true"></div>
      <span id="scenario-note" class="scenario-note"></span>
    </div>
  </section>

  <div id="mode-banner" class="mode-banner"></div>

  <main class="layout">
    <section class="map-wrap">
      <div id="kpis" class="kpis"></div>
      <div class="view-tabs" role="tablist" aria-label="Main view">
        <button role="tab" class="view-tab active" data-view="topo">Where agents run</button>
        <button role="tab" class="view-tab" data-view="map">Map</button>
        <button role="tab" class="view-tab" data-view="presentation">Presentation</button>
      </div>
      <div id="topo" class="topo" aria-label="Where agents and databases are running"></div>
      <div id="deck" class="deck" hidden aria-label="Presentation: the brief deck">
        <div class="deck-stage"><img id="deck-img" alt=""></div>
        <div class="deck-bar">
          <button id="deck-prev" class="deck-btn" aria-label="Previous slide">&#8249;</button>
          <span id="deck-count" class="deck-count"></span>
          <button id="deck-next" class="deck-btn" aria-label="Next slide">&#8250;</button>
          <span id="deck-title" class="deck-title"></span>
          <button id="deck-full" class="deck-full" aria-pressed="false">Full window</button>
          <a id="deck-pdf" class="deck-pdf" target="_blank" rel="noopener">Open the PDF</a>
        </div>
        <div id="deck-thumbs" class="deck-thumbs" role="tablist" aria-label="Slides"></div>
      </div>
      <div class="map-box" hidden>
        <div id="map" aria-label="Map of assets, depots and technicians"></div>
        <div class="legend">
          <span><i class="dot healthy"></i>Healthy</span>
          <span><i class="dot warning"></i>Warning</span>
          <span><i class="dot fault"></i>Fault</span>
          <span><i class="sq"></i>Depot (edge server)</span>
          <span><i class="tech"></i>Technician</span>
        </div>
      </div>
    </section>
    <aside id="panel" class="panel"></aside>
  </main>

  <section id="live" class="live" aria-label="Live requests">
    <div class="live-head">
      <button id="live-toggle" class="live-title" aria-expanded="true"><span class="pulse" aria-hidden="true"></span>Live requests</button>
      <div id="live-totals" class="live-totals"></div>
      <button id="live-clear" class="btn small ghost">Clear</button>
    </div>
    <div class="live-cols" aria-hidden="true">
      <span>When</span><span>From</span><span>Request</span><span>Tool</span><span>Ran on</span><span>Why there</span><span class="r">Time</span><span class="r">Tokens</span>
    </div>
    <div id="live-rows" class="live-rows"></div>
  </section>

  <button id="ask-fab" class="ask-fab" aria-label="Open assistant"><span class="brand-mark small" aria-hidden="true"></span>Ask</button>
  <section id="assistant" class="assistant" hidden aria-label="Assistant">
    <div class="as-head">
      <div><b>Assistant</b><div id="as-context" class="sub"></div></div>
      <button id="as-close" class="as-x" aria-label="Close assistant">×</button>
    </div>
    <div id="as-msgs" class="as-msgs"></div>
    <div id="as-chips" class="as-chips"></div>
    <form id="as-form" class="as-form">
      <input id="as-input" type="text" placeholder="Ask about this job…" autocomplete="off" aria-label="Ask the assistant">
      <button class="btn small" type="submit">Send</button>
    </form>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data.js"></script>
  <script src="presentation/slides.js"></script>
  <script src="app.js"></script>
</body>
</html>
